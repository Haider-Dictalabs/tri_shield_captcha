name: tri_shield_captcha
description: A comprehensive Flutter CAPTCHA solution with multi-layer security verification including device fingerprinting, ALTCHA, and slider CAPTCHA.
version: 1.0.0
homepage: https://github.com/Haider-Dictalabs/tri_shield_captcha
repository: https://github.com/Haider-Dictalabs/tri_shield_captcha
issue_tracker: https://github.com/Haider-Dictalabs/tri_shield_captcha/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  http:
  altcha_widget:
  device_info_plus:
  safe_device: ^1.1.8
  battery_plus:
  connectivity_plus:
  jailbreak_root_detection:
  sensors_plus:
  crypto:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

